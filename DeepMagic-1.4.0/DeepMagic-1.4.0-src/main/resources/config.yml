# ============================================================
#  DeepMagic v1.1.0 — магический арсенал DeepProgression
#  Магический компрессор (GUI v2) · 73 вещества · 73 посоха · синергии
#  Все числа можно менять на ходу (/mage reload).
# ============================================================

# Мирова, где работает магия. Пусто = во всех мирах.
worlds: []

# ---------- Компрессор ----------
compressor:
  cycle_ticks: 40          # длительность цикла сжатия (40 т = 2 с)
  units_per_cycle: 512     # сколько единиц ресурса сжимается за цикл
  fuel_per_cycle: 1        # расход магмового крема за цикл
  # Единиц ресурса на вещество тира I (по редкости ветки DeepProgression)
  units_common: 64000      # 64 000 — как в ТЗ (морковь, уголь)
  units_medium: 16000
  units_rare: 4000
  # Пересжатие: вещество тира II/III — через тот же конвейер
  # (вещество = 512 ед. сжатия, гейт по медали в профиле при закладке)
  recompress_gate_tier2: 6 # медаль ветки ≥ 6 для закладки вещества II
  recompress_gate_tier3: 9 # медаль ветки ≥ 9 для закладки вещества III

# ---------- Посохи ----------
staffs:
  # Гейт крафта: медаль ветки тир ≥ 3 в сетке (расходуется, /dp medals возвращает)
  craft_gate_tier: 3
  # Компоненты DeepProgression по тиру вещества: I / II / III
  component_tier1: steel_plate
  component_tier2: node_power
  component_tier3: board_elite
  # Мана: если топлива нет в инвентаре, посох берёт из тайника ресурсов DP
  use_pouch_fuel: true

# ---------- PvP и безопасность ----------
pvp:
  enabled: true            # глобальный рубильник боевых эффектов посохов по игрокам
  spawn_safe_radius: 64    # радиус мира от точки спавна, где боевые эффекты запрещены
  # Вечное горение (уголь + магмовый жар): 1 урон/с, игнорирует огнестойкость.
  # Гасится: вода, ведро, дождь, арбузный посох, берёзовый сок, бетон, влажность.
  eternal_burn_dps: 1.0

# ---------- Кулдауны посохов (секунды; 0 = значение из реестра) ----------
cooldowns:
  # пример переопределения: COAL: 10

# ---------- Угольная пыль (удушение) ----------
dust:
  duration: 10             # сек работы эмиттера
  radius: 3.0              # радиус облака
  grace_seconds: 4         # первые N секунд — только замедление, без урона
  dps_after_grace: 1.0     # урон в секунду после грации
  cooldown: 60

# ---------- Вещества: лор ----------
# Каждое вещество и посох имеют собственный лор из реестра плагина.
# Здесь можно переопределить только глобальные строки.
lore:
  tier_names: ["Спрессованное", "Двойное Сжатие", "Абсолютное Сжатие"]

messages:
  prefix: "&8[&5Магия&8] &r"
